############################################################
# Configuration syslog-ng du projet
# A placer dans /etc/syslog-ng/conf.d/projet_elk.conf
# Collecte les alertes Snort et les ecrit dans un fichier
# dedie, repris ensuite par Filebeat vers Elasticsearch.
############################################################

# Inclusion de tous les fichiers de conf.d
@include "/etc/syslog-ng/conf.d/*.conf"

# Destination : fichier de logs du projet
destination d_projet_elk { file("/var/log/syslog_projet_elk.log"); };

# Filtre : ne garder que les messages provenant de Snort
filter f_snort { program("snort") or match("snort" value("MESSAGE")); };

# Chemin de log : source systeme -> filtre Snort -> destination
log { source(s_src); filter(f_snort); destination(d_projet_elk); };
